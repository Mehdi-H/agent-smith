name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # Authenticate report uploads to Codecov without a stored token.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    env:
      COMPLEXITY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install repository tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
      - name: Install Python and locked dependencies
        run: |
          uv python install "$UV_PYTHON"
          uv sync --locked --group release
          uv run --offline --no-sync python --version
      - name: Check repository
        run: just check
      - name: Run all test suites and generate reports
        run: just test
      - name: Upload test results to Codecov
        if: >-
          !cancelled() && hashFiles('junit.xml') != '' &&
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1
        with:
          use_oidc: true
          files: junit.xml
          disable_search: true
          fail_ci_if_error: true
          name: python-${{ matrix.python-version }}
      - name: Upload coverage to Codecov
        if: >-
          !cancelled() && hashFiles('coverage.xml') != '' &&
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          use_oidc: true
          files: coverage.xml
          disable_search: true
          fail_ci_if_error: true
          name: python-${{ matrix.python-version }}
