name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bootstrap:
        description: Create a patch release even without feature/fix commits
        type: boolean
        default: false
      retry_tag:
        description: Retry publishing an existing release tag (e.g. v0.3.1)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  checks:
    permissions:
      contents: read
      id-token: write # Allow the reusable CI to authenticate with Codecov.
    if: github.ref == 'refs/heads/main'
    uses: $/.github/workflows/ci.yml

  release:
    needs: checks
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      released: ${{ steps.version.outputs.released }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
      - name: Install locked release tools
        run: uv sync --locked --group release
      - name: Select the checked main revision
        run: git switch -C main "$GITHUB_SHA"
      - name: Create release or recover its existing distributions
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BOOTSTRAP: ${{ inputs.bootstrap || false }}
          RELEASE_RETRY_TAG: ${{ inputs.retry_tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ -n "$RELEASE_RETRY_TAG" ]; then
            just release-recover "$RELEASE_RETRY_TAG"
          else
            just release
          fi
      - name: Preserve distributions for the PyPI job and troubleshooting
        if: steps.version.outputs.released == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30
      - name: Attach distributions to GitHub release
        if: steps.version.outputs.released == 'true' && !inputs.retry_tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: just publish-github

  publish:
    needs: release
    if: github.ref == 'refs/heads/main' && needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-distributions
          path: dist
      - name: Publish the same distributions to PyPI
        run: just publish-pypi
