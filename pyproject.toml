[project]
name = "agent-smith"
version = "0.0.0"
description = "Build agent instructions from your project's sources."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.scripts]
agent-smith = "agent_smith.__main__:main"

[project.urls]
Repository = "https://github.com/Mehdi-H/agent-smith"
Issues = "https://github.com/Mehdi-H/agent-smith/issues"

[build-system]
requires = ["uv_build==0.12.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "deptry>=0.25.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.7",
    "ty>=0.0.80",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ANN", "RUF"]

[tool.ty.environment]
python-version = "3.10"

[tool.ty.terminal]
error-on-warning = true

[tool.deptry]
github_warning_errors = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers --cov=agent_smith --cov-branch --cov-report=term-missing"
filterwarnings = ["error"]
markers = ["integration: execute the installed CLI in a separate process"]

[tool.coverage.run]
relative_files = true
patch = ["subprocess"]

[tool.coverage.report]
show_missing = true
