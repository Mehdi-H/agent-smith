[project]
name = "agent-smith"
version = "0.0.0"
description = "Build agent instructions from your project's sources."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.scripts]
agent-smith = "agent_smith.__main__:main"

[project.urls]
Repository = "https://github.com/Mehdi-H/agent-smith"
Issues = "https://github.com/Mehdi-H/agent-smith/issues"

[build-system]
requires = ["uv_build==0.12.13"]
build-backend = "uv_build"
