[project]
name = "agent-smith-cli"
version = "0.3.0"
description = "Build agent instructions from your project's sources."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "markdown-it-py>=4,<5",
    "tomli>=2 ; python_full_version < '3.11'",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.scripts]
agent-smith = "agent_smith.__main__:main"

[project.urls]
Repository = "https://github.com/Mehdi-H/agent-smith"
Issues = "https://github.com/Mehdi-H/agent-smith/issues"

[build-system]
requires = ["uv_build==0.12.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "bandit[toml]>=1.9.4",
    "complexipy>=6.2,<7",
    "deptry>=0.25.1",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.7",
    "ty>=0.0.80",
]
release = [
    "python-semantic-release==10.6.2",
]

[tool.uv.build-backend]
module-name = "agent_smith"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ANN", "RUF"]

[tool.ty.environment]
python-version = "3.10"

[tool.ty.terminal]
error-on-warning = true

[tool.deptry]
github_warning_errors = []

[tool.deptry.per_rule_ignores]
# tomllib is stdlib on 3.11+ and only imported behind a version guard.
# On 3.10, deptry scans that inactive branch; the runtime uses declared tomli.
DEP001 = ["tomllib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers --cov=agent_smith --cov-branch --cov-report=term-missing"
filterwarnings = ["error"]

[tool.coverage.run]
relative_files = true
patch = ["subprocess"]

[tool.coverage.report]
show_missing = true

[tool.semantic_release]
allow_zero_version = true
major_on_zero = false
commit_parser = "conventional"
version_toml = ["pyproject.toml:project.version"]
tag_format = "v{version}"
commit_message = "chore(release): {version} 📦"
build_command = "just release-build"
assets = ["uv.lock"]

[tool.semantic_release.branches.main]
match = "^main$"
prerelease = false

[tool.semantic_release.commit_parser_options]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]

[tool.semantic_release.changelog]
mode = "update"

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"

[tool.semantic_release.publish]
dist_glob_patterns = ["dist/*.whl", "dist/*.tar.gz"]

[tool.uv]
# PSR 10.6.2's ~=8.1.0 cap selects Click affected by PYSEC-2026-2132.
# Keep the upstream <8.5 ceiling; exercise PSR's real CLI in integration tests.
override-dependencies = ["click>=8.3.3,<8.5"]
